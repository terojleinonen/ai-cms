version: "3.9"
services:
  api:
    build:
      context: ../backend
      dockerfile: Dockerfile.api
    ports:
      - "5000:8080"
  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile.frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_BASE=http://localhost:5000
